<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>issue-flow — workflow</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--rule:rgba(45,49,66,0.12);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Geist',sans-serif;padding:3rem 2rem;}
  .wrap{max-width:980px;margin:0 auto;}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem;}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.75rem;margin:0 0 .25rem;}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 2rem;max-width:60ch;}
  svg{width:100%;height:auto;display:block;}
  footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule);font-family:'Geist Mono',monospace;font-size:8px;letter-spacing:.12em;color:var(--soft);text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Forge plugin · workflow skill</p>
  <h1>issue-flow</h1>
  <p class="sub">One session takes a tracker issue from its title to a deployed change. The tag on each step says what guards it: a tool the agent cannot bypass, prose it can miss, or the human.</p>

<svg viewBox="0 0 920 1220" role="img" aria-labelledby="issue-flow-title issue-flow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="issue-flow-title">issue-flow workflow, from orientation to close-out</title>
  <desc id="issue-flow-desc">A flowchart of eight steps running top to bottom — orient, clarify, plan, implement, prove, an approval gate, ship, close out — with three branches leaving to a stop state when a claim is falsified, information is missing, or the change proves unshippable, plus two return arrows when the user rejects the diff or a deploy fails. Each step is tagged with whether a tool, the skill's prose, or the user enforces it.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ===== ARROWS FIRST (z-order behind boxes) ===== -->
  <!-- spine -->
  <line x1="320" y1="164" x2="320" y2="212" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="284" x2="320" y2="332" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="404" x2="320" y2="452" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="524" x2="320" y2="572" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="644" x2="320" y2="672" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="792" x2="320" y2="832" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="320" y1="904" x2="320" y2="952" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- branches out to STOP -->
  <path d="M440 132 H592 A8 8 0 0 1 600 140 V452 A8 8 0 0 0 608 460 H612"
        fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M440 252 H562 A8 8 0 0 1 570 260 V472 A8 8 0 0 0 578 480 H612"
        fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M440 612 H532 A8 8 0 0 0 540 604 V508 A8 8 0 0 1 548 500 H612"
        fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- return: gate rejects the diff -->
  <path d="M180 736 H148 A8 8 0 0 1 140 728 V500 A8 8 0 0 1 148 492 H192"
        fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <!-- return: deploy or integration fails -->
  <path d="M440 872 H512 A8 8 0 0 0 520 864 V744 A8 8 0 0 0 512 736 H468"
        fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>

  <!-- ===== ARROW LABELS (masked, 6-10px clear of the stroke) ===== -->
  <rect x="464" y="104" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="494" y="113" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">FALSIFIED</text>

  <rect x="464" y="224" width="68" height="12" rx="2" fill="#f5f5f5"/>
  <text x="498" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NEEDS INFO</text>

  <rect x="456" y="584" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="492" y="593" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">UNSHIPPABLE</text>

  <rect x="152" y="708" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="180" y="717" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REJECTED</text>

  <rect x="528" y="796" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="568" y="805" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">DEPLOY FAILED</text>

  <rect x="336" y="800" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="364" y="809" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>

  <!-- ===== NODES ===== -->
  <!-- 1 ORIENT (start, oval) -->
  <rect x="200" y="100" width="240" height="64" rx="20" fill="#f5f5f5"/>
  <rect x="200" y="100" width="240" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="212" y="108" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="228" y="117" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="320" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Orient</text>
  <text x="320" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">CLAUDE.md · forge -h · memory</text>

  <!-- 2 CLARIFY -->
  <rect x="200" y="220" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="200" y="220" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="212" y="228" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="230" y="237" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
  <text x="320" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Clarify</text>
  <text x="320" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">two readings → concrete cases</text>

  <!-- 3 PLAN -->
  <rect x="200" y="340" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="200" y="340" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="212" y="348" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="230" y="357" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
  <text x="320" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Plan</text>
  <text x="320" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">lands on the issue, not on disk</text>

  <!-- 4 IMPLEMENT -->
  <rect x="200" y="460" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="200" y="460" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="212" y="468" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="230" y="477" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
  <text x="320" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Implement</text>
  <text x="320" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">one branch · commit per issue</text>

  <!-- 5 PROVE -->
  <rect x="200" y="580" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="200" y="580" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="212" y="588" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="228" y="597" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="320" y="616" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Prove &amp; capture evidence</text>
  <text x="320" y="632" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">gates · run it · look at it</text>

  <!-- 6 GATE (decision, focal) -->
  <polygon points="320,680 460,736 320,792 180,736" fill="#f5f5f5"/>
  <polygon points="320,680 460,736 320,792 180,736" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="304" y="700" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
  <text x="320" y="709" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="320" y="732" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Present &amp; wait</text>
  <text x="320" y="748" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">approval binds one diff</text>

  <!-- 7 SHIP -->
  <rect x="200" y="840" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="200" y="840" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="212" y="848" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="228" y="857" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="320" y="876" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Ship</text>
  <text x="320" y="892" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">discovered path · verify live</text>

  <!-- 8 CLOSE OUT (end, oval) -->
  <rect x="200" y="952" width="240" height="64" rx="20" fill="#f5f5f5"/>
  <rect x="200" y="952" width="240" height="64" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="212" y="960" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="230" y="969" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
  <text x="320" y="988" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Close out</text>
  <text x="320" y="1004" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">tear down · record the learning</text>

  <!-- 9 STOP (end, oval) -->
  <rect x="612" y="440" width="216" height="80" rx="20" fill="#f5f5f5"/>
  <rect x="612" y="440" width="216" height="80" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="624" y="452" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="642" y="461" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
  <text x="720" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Stop — park or close</text>
  <text x="720" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">evidence posted, branch named</text>

  <!-- ===== LEGEND ===== -->
  <line x1="32" y1="1088" x2="888" y2="1088" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="32" y="1108" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="112" y="1100" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="128" y="1109" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="152" y="1109" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">a program enforces it — cannot be missed</text>

  <rect x="424" y="1100" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="442" y="1109" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
  <text x="468" y="1109" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">prose only — an agent can skip it</text>

  <rect x="700" y="1100" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
  <text x="716" y="1109" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="740" y="1109" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">the human decides</text>

  <line x1="112" y1="1140" x2="144" y2="1140" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="152" y="1143" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">the issue leaves the flow without code</text>
  <line x1="424" y1="1140" x2="456" y2="1140" stroke="#2e5aa8" stroke-width="1"/>
  <text x="468" y="1143" fill="#4f5d75" font-size="9" font-family="'Geist',sans-serif">approval is void — return with new evidence</text>
</svg>

  <footer>issue-flow · forge plugin · five of nine steps rest on prose alone</footer>
</div>
</body>
</html>
